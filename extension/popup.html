<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LiteSight Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      margin: 0;
      padding: 0;
      width: 380px;
      overflow: hidden;
      background: transparent;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: #1e293b;
    }

    /* ── Card wrap ────────────────────────────────────── */
    .card {
      background: #fafbfc;
      width: 100%;
      min-height: 100%;
      margin: 0;
      border-radius: 0;
      overflow: hidden;
      box-shadow:
        inset 0 0 0 1px rgba(99,102,241,0.45),
        inset 0 0 16px rgba(99,102,241,0.30),
        inset 0 0 36px rgba(99,102,241,0.15);
    }

    @media (prefers-reduced-motion: no-preference) {
      .card {
        animation: pulse-glow-inset 4.5s ease-in-out infinite alternate;
      }
    }

    @keyframes pulse-glow-inset {
      0% {
        box-shadow:
          inset 0 0 0 1px rgba(99,102,241,0.35),
          inset 0 0 12px rgba(99,102,241,0.22),
          inset 0 0 28px rgba(99,102,241,0.11);
      }
      100% {
        box-shadow:
          inset 0 0 0 1px rgba(99,102,241,0.55),
          inset 0 0 20px rgba(99,102,241,0.38),
          inset 0 0 44px rgba(99,102,241,0.20);
      }
    }

    /* ── Header — pastel indigo→sky gradient ─────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 13px;
      background: linear-gradient(135deg, #6366f1 0%, #38bdf8 100%);
      border-radius: 0;
    }
    .header-logo {
      width: 32px; height: 32px;
      background: rgba(255,255,255,0.22);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 12px; letter-spacing: -1px; color: #fff;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.30);
    }
    .header-title {
      font-size: 15px; font-weight: 700; color: #fff; letter-spacing: -.3px;
    }
    .header-sub {
      font-size: 10px; color: rgba(255,255,255,0.72); margin-top: 1px;
    }
    .header-status {
      margin-left: auto;
      width: 8px; height: 8px; border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 0 3px rgba(74,222,128,.35);
      flex-shrink: 0;
    }
    .header-status.idle {
      background: rgba(255,255,255,0.40);
      box-shadow: none;
    }

    /* ── Body ─────────────────────────────────────────── */
    .body { padding: 14px 14px 14px; }

    /* ── Goal Input ───────────────────────────────────── */
    .field { margin-bottom: 10px; }
    label.field-label {
      display: block;
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .8px;
      color: #94a3b8; margin-bottom: 5px;
    }
    #goalInput {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1.5px solid #e2e8f0;
      background: #f8fafc;
      color: #1e293b;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    #goalInput:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,.13);
    }

    /* ── Button Row ───────────────────────────────────── */
    .btn-row {
      display: flex;
      gap: 7px;
      margin-bottom: 10px;
    }
    .btn {
      flex: 1;
      padding: 9px 10px;
      border-radius: 8px;
      border: none;
      font-size: 12px; font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: opacity .15s, transform .1s, box-shadow .15s;
      letter-spacing: .2px;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .38; cursor: not-allowed; }

    /* Gradient Run button */
    #runBtn {
      background: linear-gradient(135deg, #6366f1 0%, #38bdf8 100%);
      color: #fff;
      box-shadow: 0 2px 8px rgba(99,102,241,.28);
    }
    #runBtn:not(:disabled):hover {
      opacity: .88;
      box-shadow: 0 4px 14px rgba(99,102,241,.36);
    }

    /* Outlined Stop button */
    #stopBtn {
      background: #fff;
      color: #ef4444;
      border: 1.5px solid #ef4444;
      flex: 0 0 68px;
    }
    #stopBtn:not(:disabled):hover { background: #fff5f5; }

    /* Outlined Preview button */
    #previewBtn {
      background: #fff;
      color: #6366f1;
      border: 1.5px solid #c7d2fe;
      flex: 0 0 auto;
      white-space: nowrap;
    }
    #previewBtn:not(:disabled):hover { background: #eef2ff; }
    #previewBtn.active {
      background: linear-gradient(135deg, #6366f1, #38bdf8);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 2px 8px rgba(99,102,241,.25);
    }

    /* ── Log — monospace only ─────────────────────────── */
    #log {
      height: 148px;
      overflow-y: auto;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 10px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      line-height: 1.6;
      white-space: pre-wrap;
      margin-bottom: 0;
      color: #475569;
    }
    #log:empty::before {
      content: "Logs will appear here…";
      color: #cbd5e1;
    }
    /* Log colours — readable on light background */
    .log-info    { color: #64748b; }
    .log-success { color: #16a34a; }
    .log-fail    { color: #dc2626; }
    .log-warn    { color: #d97706; }

    /* ── Redaction Panel ──────────────────────────────── */
    #redactPanel {
      display: none;
      background: #f8fafc;
      border: 1.5px solid #e0e7ff;
      border-radius: 10px;
      margin-top: 10px;
      overflow: hidden;
    }
    #redactPanel.visible { display: block; }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: linear-gradient(135deg, #eef2ff 0%, #e0f2fe 100%);
      border-bottom: 1px solid #e0e7ff;
    }
    .panel-title {
      font-size: 11px; font-weight: 700; color: #4f46e5;
      text-transform: uppercase; letter-spacing: .6px;
    }
    /* Counts line — subtly highlighted */
    .counts-line {
      font-size: 10px; color: #94a3b8;
      background: rgba(99,102,241,.07);
      border-radius: 4px;
      padding: 1px 6px;
    }
    .counts-line strong { color: #4f46e5; font-weight: 700; }

    /* Two-column grid */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid #e0e7ff;
    }
    .two-col:last-child { border-bottom: none; }

    /* Column headers — labelled "On page" / "Sent to server" */
    .col-head {
      font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .7px; color: #94a3b8;
      padding: 6px 10px 4px;
      background: #f1f5f9;
    }
    .col-head:first-child { border-right: 1px solid #e0e7ff; }

    .col-body {
      padding: 4px 8px 8px;
      max-height: 96px; overflow-y: auto;
    }
    .col-body:first-child { border-right: 1px solid #e0e7ff; }

    .pii-row {
      display: flex; flex-direction: column;
      margin-bottom: 6px;
    }
    .pii-label {
      font-size: 9px; color: #94a3b8; font-weight: 600;
      text-transform: uppercase; letter-spacing: .5px;
      margin-bottom: 2px;
    }
    /* "On page" original value */
    .pii-value {
      font-family: 'Courier New', monospace;
      font-size: 10px;
    }
    .pii-value.original { color: #ef4444; }

    /* "Sent to server" — blue highlight box */
    .pii-value.redacted {
      display: inline-block;
      color: #1d4ed8;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      border: 2px solid #2563EB;
      border-radius: 6px;
      background: rgba(37,99,235,0.08);
      padding: 1px 5px;
    }
  </style>
</head>
<body>
<div class="card">

  <!-- Header -->
  <div class="header">
    <div class="header-logo">LS</div>
    <div>
      <div class="header-title">LiteSight</div>
      <div class="header-sub">Edge Web Agent</div>
    </div>
    <div class="header-status idle" id="statusDot"></div>
  </div>

  <!-- Body -->
  <div class="body">

    <!-- Goal input -->
    <div class="field">
      <label class="field-label" for="goalInput">Goal / Instruction</label>
      <input type="text" id="goalInput" />
    </div>

    <!-- Buttons -->
    <div class="btn-row">
      <button class="btn" id="runBtn">▶ Run Agent</button>
      <button class="btn" id="stopBtn" disabled>■ Stop</button>
      <button class="btn" id="previewBtn">🔒 Preview</button>
    </div>

    <!-- Log -->
    <div id="log"></div>

    <!-- Redaction panel (hidden by default) -->
    <div id="redactPanel">
      <div class="panel-header">
        <span class="panel-title">Original vs Sent</span>
        <span class="counts-line" id="countsLine">—</span>
      </div>
      <!-- Column headers -->
      <div class="two-col">
        <div class="col-head">On page</div>
        <div class="col-head">Sent to server</div>
      </div>
      <!-- Column bodies -->
      <div class="two-col">
        <div class="col-body" id="originalCol"></div>
        <div class="col-body" id="sentCol"></div>
      </div>
    </div>

  </div><!-- /body -->

</div><!-- /card -->
<script src="popup.js"></script>
</body>
</html>
